version: 1.0
runtime: python312
build:
  commands:
    pre-run:
      - pip install -r requirements.txt
run:
  command: ./entrypoint.sh
  network:
    port: 8080
    env: PORT
  env:
    - name: STORE_BACKEND
      value: dynamodb
    - name: DYNAMODB_TABLE_PREFIX
      value: agenthr_
    - name: LLM_BACKEND
      value: bedrock
    - name: BEDROCK_MODEL_ID
      value: us.amazon.nova-pro-v1:0
    - name: AWS_REGION
      value: us-east-1
    - name: AGENT_AUTONOMOUS
      value: "1"
    - name: ENABLE_APPROVAL_GATE
      value: "1"
    - name: APP_HOST
      value: "0.0.0.0"
    - name: APP_PORT
      value: "8000"
    - name: ADMIN_EMAIL
      value: hr@agenthr.ai
    - name: ADMIN_PASSWORD
      value: admin123
